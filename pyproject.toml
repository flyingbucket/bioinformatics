[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nw-align"
version = "0.1.0"
description = "Needleman–Wunsch alignment (Python + C/OpenMP)"
authors = [{ name = "flyingbucket" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = ["numpy>=2.0", "biopython>=1.86", "numba>=0.60"]

[project.optional-dependencies]
bench = ["pandas>=2.0", "tqdm>=4.0", "openpyxl>=3.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["nw_align*"]
